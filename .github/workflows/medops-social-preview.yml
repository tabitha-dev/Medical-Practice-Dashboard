name: Render MedOps social preview PNG
on:
  push:
    branches: [feature/medical-dashboard-modern-a11y-seo-20261029]
    paths:
      - social-preview.svg
      - .github/workflows/medops-social-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg==2.8.2
      - name: Render social share PNG
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          cairosvg.svg2png(url='social-preview.svg',write_to='social-preview.png',output_width=1200,output_height=630)
          assert Path('social-preview.png').stat().st_size > 5000
          print('Generated:',Path('social-preview.png').stat().st_size,'bytes')
          PY
      - name: Commit to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m 'Create compatible MedOps social card PNG'
            git push origin HEAD:feature/medical-dashboard-modern-a11y-seo-20261029
          fi
